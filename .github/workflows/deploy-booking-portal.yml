name: Deploy Booking Portal to Cloud Run

# 预约后台:2026-09-13 起从 portal.js（Node 原生 http server）直接换成
# booking-app/(Next.js + Prisma,迁移自 archive/beauty),复用同一个 Cloud Run
# 服务名/URL,不是新增独立服务——Eric 明确要求"没必要新增独立的,就还用刚刚那个"。
# 跟 deploy-ceo-site.yml 是完全独立的两条流水线，互不触发（paths 各管各的）。
#
# 部署前必须在 GCP 项目里手动建好以下 Secret（本仓库暂时没有权限从 CI
# 之外的地方自动建，见 docs/ 里的部署记录）：
#   booking-portal-database-url（沿用旧的，同一个 Neon 连接串，schema 已在库内升级）
#   booking-portal-jwt-secret（2026-09-13 新增，签发登录 session）
# 同一个 GCP_SA_KEY（已经在用）需要有这两个 secret 的 secretmanager.secretAccessor 角色。
on:
  push:
    branches: ["main"]
    paths:
      - "booking-app/**"
      - ".github/workflows/deploy-booking-portal.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: supply-491510
      # 沿用 deploy-ceo-site.yml 已经建好的 asia-east1/triplan Artifact
      # Registry 仓库——northamerica-northeast1 下没有这个仓库，新建又要
      # 我这边没有的 GCP 权限。目标客户在多伦多，这个选择会带来跨区延迟，
      # 不是没有代价，但比让 Eric 再手动跑一条 gcloud 命令建仓库更划算；
      # 真影响体验了再单独迁移，不提前优化一个还没验证是不是问题的问题。
      REGION: asia-east1
      SERVICE_NAME: booking-portal
      IMAGE: asia-east1-docker.pkg.dev/supply-491510/triplan/booking-app:${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: docker build -t ${{ env.IMAGE }} -f booking-app/Dockerfile booking-app/

      - run: docker push ${{ env.IMAGE }}

      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=2 \
            --cpu=1 --memory=512Mi --port=8080 \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="DATABASE_URL=booking-portal-database-url:latest,JWT_SECRET=booking-portal-jwt-secret:latest" \
            --quiet
          # --allow-unauthenticated 让浏览器能直接访问，真正的门在应用层
          # /login + JWT cookie（booking-app/proxy.ts + lib/auth.ts），
          # 没有 session cookie 会被重定向到 /login，不是网关层拦截。

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "URL: $URL"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL/calendar")
          echo "未带凭据访问 /calendar → HTTP $CODE（期望落在 /login，200）"
          if [ "$CODE" != "200" ]; then
            echo "✗ 鉴权重定向异常：期望 200（重定向后落在登录页），实际 $CODE"
            exit 1
          fi

          # 光有 200 不代表业务能跑通——2026-09-13 portal.js 那次事故就是只测了
          # 401 没测真实渲染，被 OOM 混过去。这次测真实登录 + 有数据的日历页。
          U="shinenail@shine-nail-studio.local"
          P=$(gcloud secrets versions access latest --secret=booking-portal-pass --project=${{ env.PROJECT_ID }})
          LOGIN_CODE=$(curl -s -c /tmp/cookies.txt -X POST "$URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$U\",\"password\":\"$P\"}" \
            -o /dev/null -w "%{http_code}")
          echo "登录 API → HTTP $LOGIN_CODE"
          if [ "$LOGIN_CODE" != "200" ]; then
            echo "✗ 登录失败，期望 200，实际 $LOGIN_CODE"
            exit 1
          fi

          CAL_CODE=$(curl -s -b /tmp/cookies.txt -o /dev/null -w "%{http_code}" "$URL/calendar")
          echo "登录后访问日历页 → HTTP $CAL_CODE"
          if [ "$CAL_CODE" != "200" ]; then
            echo "✗ 日历页渲染失败，期望 200，实际 $CAL_CODE"
            exit 1
          fi
          echo "✅ 部署成功：登录 + 日历渲染正常 → $URL"
